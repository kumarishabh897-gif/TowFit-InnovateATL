# Vehicle specs used to pre-fill and sanity-check the disabled-vehicle profile.
#
# Two sections:
#   models          real make/model rows with a public source (provenance ESTIMATED)
#   class_defaults  class-typical fallbacks when a model is unknown or a field is missing (provenance ASSUMED)
#
# Every row carries provenance, status and source, like assumptions.yaml. A value that is
# null means "no source yet" and the engine falls back to class_defaults (flagged ASSUMED).

models:
  - id: honda_accord_2022
    make_model: "2022 Honda Accord"
    vehicle_class: passenger_car
    curb_weight_lb: 3300
    curb_weight_lb_range: [3150, 3446]
    wheelbase_mm: 2830
    tire_width_mm_range: [225, 235]
    ground_clearance_mm: null
    gross_vehicle_weight_rating_lb: null
    provenance: ESTIMATED
    status: SOURCED
    source: "Honda info center, 2022 Accord specifications: https://www.hondainfocenter.com/2022/Accord/Feature-Guide/Specifications/"
    note: "Trim range 3,150-3,446 lb, wheelbase 111.4 in, tires 225/50R17 and 235/40R19 (widths 225-235 mm). The 3,300 lb point value is a demo pick inside the range because no trim is specified. Ground clearance is not published on that page."

  - id: toyota_rav4_2022
    make_model: "2022 Toyota RAV4"
    vehicle_class: suv
    curb_weight_lb: 3490
    curb_weight_lb_range: [3370, 4300]
    wheelbase_mm: null
    tire_width_mm_range: null
    ground_clearance_mm: null
    gross_vehicle_weight_rating_lb: null
    provenance: ESTIMATED
    status: PLACEHOLDER
    source: "https://www.thecarconnection.com/specifications/toyota_rav4_2022 (figures read from a search-result summary; the page itself returned 403 to a direct fetch)"
    note: "Range 3,370-4,300 lb spans all trims including hybrid and plug-in hybrid. 3,490 lb is the AWD figure quoted in that summary. Verify against Toyota's own spec sheet before promoting to SOURCED."

  - id: ford_f150_supercrew_4x4_2022
    make_model: "2022 Ford F-150 SuperCrew 4x4"
    vehicle_class: pickup
    curb_weight_lb: 5100
    curb_weight_lb_range: [5020, 5267]
    wheelbase_mm: null
    tire_width_mm_range: null
    ground_clearance_mm: null
    gross_vehicle_weight_rating_lb: null
    provenance: ESTIMATED
    status: PLACEHOLDER
    source: "Edmunds / TheCarConnection 2022 F-150 spec pages (figures read from a search-result summary; direct fetch returned 403)"
    note: "Range 5,020-5,267 lb for SuperCrew 4x4 with same bed and engine. 5,100 lb is a demo pick inside the range, about 85% of PATROL-42's 6,000 lb placeholder capacity (scenario 3). Verify against Ford's spec sheet."

  - id: isuzu_npr_hd_box_truck
    make_model: "Isuzu NPR-HD box truck"
    vehicle_class: box_truck
    curb_weight_lb: null
    curb_weight_lb_range: null
    wheelbase_mm: null
    tire_width_mm_range: null
    ground_clearance_mm: null
    gross_vehicle_weight_rating_lb: 14500
    provenance: ESTIMATED
    status: PLACEHOLDER
    source: "Isuzu Commercial Vehicles NPR-HD spec sheet, titled '14,500 LBS. GVWR CLASS 4': https://www.isuzucv.com/pdfs/npr-hd_gas_specs.pdf"
    note: "Only the GVWR was confirmed (from the sheet's title; the PDF body could not be parsed). Curb weight and body weight are not sourced. Scenario 2 uses an ASSUMED 8,000 lb curb plus 6,000 lb load = 14,000 lb, just under the GVWR."

class_defaults:
  passenger_car:  { typical_curb_weight_lb: 3300,  tire_width_mm: 225, ground_clearance_mm: 130, wheelbase_mm: 2800 }
  suv:            { typical_curb_weight_lb: 4200,  tire_width_mm: 245, ground_clearance_mm: 180, wheelbase_mm: 2850 }
  pickup:         { typical_curb_weight_lb: 5000,  tire_width_mm: 275, ground_clearance_mm: 210, wheelbase_mm: 3600 }
  van:            { typical_curb_weight_lb: 5000,  tire_width_mm: 235, ground_clearance_mm: 150, wheelbase_mm: 3300 }
  box_truck:      { typical_curb_weight_lb: 8000,  tire_width_mm: 235, ground_clearance_mm: 200, wheelbase_mm: 4200 }
  bus:            { typical_curb_weight_lb: 20000, tire_width_mm: 295, ground_clearance_mm: 250, wheelbase_mm: 6000 }
  tractor_trailer: { typical_curb_weight_lb: 35000, tire_width_mm: 295, ground_clearance_mm: 300, wheelbase_mm: 6000 }
  motorcycle:     { typical_curb_weight_lb: 600,   tire_width_mm: 180, ground_clearance_mm: 140, wheelbase_mm: 1500 }
  # `unknown` deliberately has no defaults: the engine cannot check dimensions for it.

class_defaults_meta:
  provenance: ASSUMED
  status: PLACEHOLDER
  source: none
  note: "Author's estimates of class-typical values. No source has been located for any of them. They matter only when a model is unknown or a field is missing, and the UI flags them as ASSUMED."
