[project]
name = "clearanceos-api"
version = "0.0.1"
description = "ClearanceOS / TowFit API: rule engine, Decision Records, config"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",  # round-trips assumptions.yaml on live edits without losing its comments
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
